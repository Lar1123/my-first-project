<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Мои проекты</title>
    <style>
        /* Стили для красивого отображения */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9; /* Светло-серый фон */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Растягиваем на весь экран */
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 250px;
            padding: 15px;
            margin: 10px;
            text-align: center;
            background-color: #4CAF50; /* Зеленый цвет кнопок */
            color: white;
            text-decoration: none; /* Убираем подчеркивание ссылок */
            border-radius: 8px; /* Закругляем углы */
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049; /* Темнеет при наведении */
        }
    </style>
</head>

const DEAL_SEATS = ['N', 'E', 'S', 'W'];
const DEAL_NAMES = { N: 'Север', E: 'Восток', S: 'Юг', W: 'Запад' };
const DEAL_DD_LIMIT = 5;      // с этого числа карт на руке защита и проверки считают перебором
let deal = null;

function dealParse(txt) {
    const cards = [];
    txt.split(/\s+/).filter(Boolean).forEach(part => {
        const [s, holding] = part.split(':');
        leadParse(holding || '').forEach(r => cards.push({ s, r }));
    });
    return cards;
}
function dealRank(r) { return 13 - LEAD_RANKS.indexOf(r); }
function dealNextSeat(p) { return DEAL_SEATS[(DEAL_SEATS.indexOf(p) + 1) % 4]; }
function dealPartner(p) { return DEAL_SEATS[(DEAL_SEATS.indexOf(p) + 2) % 4]; }
function dealIsNS(p) { return p === 'N' || p === 'S'; }
function dealTrump() { return currentTask.contract.trump; }

function dealWinner(trick, trump) {
    let best = trick[0];
    for (const t of trick.slice(1)) {
        const c = t.card, b = best.card;
        if (c.s === b.s ? dealRank(c.r) > dealRank(b.r) : c.s === trump) best = t;
    }
    return best;
}
function dealLegalFor(hand, trick) {
    const led = trick.length ? trick[0].card.s : null;
    const follow = led ? hand.filter(c => c.s === led) : [];
    return follow.length ? follow : hand;
}
function dealLegal(p) { return dealLegalFor(deal.hands[p], deal.trick); }
const byRankUp = (a, b) => dealRank(a.r) - dealRank(b.r);

/* ---------- Перебор для концовки: сколько взяток возьмут Север–Юг ----------
   worst = false — обе стороны играют лучшим образом;
   worst = true  — Север–Юг играют как угодно плохо (для «клейма»: контракт гарантирован при любой игре) */
function dealDD(hands, trick, turn, trump, worst, memo) {
    if (trick.length === 4) {
        const w = dealWinner(trick, trump).p;
        return (dealIsNS(w) ? 1 : 0) + dealDD(hands, [], w, trump, worst, memo);
    }
    let key = null;
    if (!trick.length) {
        if (!hands.N.length && !hands.E.length && !hands.S.length && !hands.W.length) return 0;
        key = turn + '|' + DEAL_SEATS.map(p => hands[p].map(c => c.s + c.r).join('')).join('|');
        if (memo.has(key)) return memo.get(key);
    }
    const maximize = dealIsNS(turn) && !worst;
    let best = maximize ? -1 : 99;
    for (const c of dealLegalFor(hands[turn], trick)) {
        const h2 = Object.assign({}, hands);
        h2[turn] = hands[turn].filter(x => x !== c);
        const v = dealDD(h2, trick.concat([{ p: turn, card: c }]), dealNextSeat(turn), trump, worst, memo);
        best = maximize ? Math.max(best, v) : Math.min(best, v);
    }
    if (key) memo.set(key, best);
    return best;
}
function dealSmall() { return Math.max(...DEAL_SEATS.map(p => deal.hands[p].length)) <= DEAL_DD_LIMIT; }

/* ---------- Защита по правилам ---------- */
function dealRuleCard(p) {
    const trump = dealTrump();
    const hand = deal.hands[p];
    const legal = dealLegal(p).slice().sort(byRankUp);
    if (!deal.trick.length) return dealLeadCard(p);
    const led = deal.trick[0].card;
    const win = dealWinner(deal.trick, trump);
    const pos = deal.trick.length;            // 1 — вторая рука, 2 — третья, 3 — четвёртая
    const partnerWins = win.p === dealPartner(p);
    const beats = c => c.s === win.card.s ? dealRank(c.r) > dealRank(win.card.r) : c.s === trump;
    if (legal[0].s === led.s) {
        if (partnerWins) return legal[0];
        const beat = legal.filter(beats);
        if (pos === 1) return dealRank(led.r) >= dealRank('10') && beat.length ? beat[0] : legal[0];  // онер кроем онером
        return beat.length ? beat[0] : legal[0];                                                       // третья, четвёртая — берём дёшево
    }
    // Масти нет: перебиваем козырем, если взятку берут противники
    if (!partnerWins) {
        const ruff = legal.filter(c => c.s === trump && beats(c)).sort(byRankUp);
        if (ruff.length) return ruff[0];
    }
    return dealDiscard(hand.filter(c => legal.includes(c)));
}
function dealDiscard(cards) {
    const trump = dealTrump();
    const bySuit = {};
    cards.forEach(c => (bySuit[c.s] = bySuit[c.s] || []).push(c));
    const suits = Object.keys(bySuit).filter(s => s !== trump);
    const pool = suits.length ? suits : Object.keys(bySuit);
    const s = pool.sort((a, b) => bySuit[b].length - bySuit[a].length)[0];
    return bySuit[s].sort(byRankUp)[0];
}
function dealLeadCard(p) {
    const trump = dealTrump();
    const hand = deal.hands[p];
    const bySuit = {};
    hand.forEach(c => (bySuit[c.s] = bySuit[c.s] || []).push(c));
    Object.values(bySuit).forEach(a => a.sort(byRankUp));
    const side = Object.keys(bySuit).filter(s => s !== trump);
    // 0. Учебная сдача «Потеря на потерю» (onSpadePlay): Запад только что взял взятку в пике
    if (currentTask.onSpadePlay && p === 'W' && deal.lastWinner === 'W' && deal.lastLeadSuit === 'S') {
        // у разыгрывающего 2+ козыря сыграно — продолжаем козырь; один — идём в трефу (Восток убивает)
        if (deal.sTrumpPlayed >= 2 && bySuit[trump]) return bySuit[trump][0];
        if (deal.sTrumpPlayed === 1 && bySuit['C']) return bySuit['C'][0];
    }
    // 0а. Особый ход защиты, заданный в самой сдаче (defLead)
    if (currentTask.defLead) {
        const c = currentTask.defLead(p, bySuit, deal);
        if (c) return c;
    }
    // 1. Масть партнёра: из дубля — старшую, иначе младшую
    for (const s of deal.ledBy[dealPartner(p)]) {
        if (s !== trump && bySuit[s] && !deal.nsRuffed.includes(s)) return bySuit[s].length === 2 ? bySuit[s][1] : bySuit[s][0];
    }
    // 1а. Продолжаем свою масть (последнюю начатую), пока её не перебивают козырем:
    //     раз начали отыгрывать масть — доводим дело до конца
    for (const s of deal.ledBy[p].slice().reverse()) {
        if (s !== trump && bySuit[s] && !deal.nsRuffed.includes(s)) return dealContinue(bySuit[s]);
    }
    // 2. Старшая из онерной секвенции (ТК, КД, ДВ, В10)
    for (const s of side) {
        const a = bySuit[s];
        const top = a[a.length - 1], next = a[a.length - 2];
        if (next && dealRank(top.r) >= dealRank('В') && dealRank(top.r) - dealRank(next.r) === 1) return top;
    }
    // 3. Младшая из самой длинной масти (козырь — только если больше нечем)
    const pool = side.length ? side : Object.keys(bySuit);
    const s = pool.sort((a, b) => bySuit[b].length - bySuit[a].length)[0];
    return bySuit[s][0];
}
/* Продолжение своей масти (карты по возрастанию): из соседних старших (10 9) — старшую, иначе младшую */
function dealContinue(cards) {
    const top = cards[cards.length - 1], next = cards[cards.length - 2];
    return next && dealRank(top.r) - dealRank(next.r) === 1 ? top : cards[0];
}

/* В концовке защита играет без ошибок; из равноценных карт — та, что по правилам */
function dealDefenseCard(p) {
    if (typeof currentTask.defenseCard === 'function') {
        const forced = currentTask.defenseCard(p, dealLegal(p));
        if (forced && dealLegal(p).includes(forced)) return forced;
    }
    const rule = dealRuleCard(p);
    if (!dealSmall()) return rule;
    const trump = dealTrump();
    const memo = new Map();
    let best = null, bestV = 99, ruleV = 99;
    for (const c of dealLegal(p).slice().sort(byRankUp)) {
        const h2 = Object.assign({}, deal.hands);
        h2[p] = deal.hands[p].filter(x => x !== c);
        const v = dealDD(h2, deal.trick.concat([{ p, card: c }]), dealNextSeat(p), trump, false, memo);
        if (v < bestV) { bestV = v; best = c; }
        if (c === rule) ruleV = v;
    }
    return ruleV <= bestV ? rule : best;
}

/* ---------- Ход игры ---------- */
function dealStart() {
    clearTimers();
    const t = currentTask;
    const parsed = {};
    DEAL_SEATS.forEach(p => (parsed[p] = dealParse(t.hands[p])));
    deal = {
        orig: { W: parsed.W.slice(), E: parsed.E.slice() },
        hands: parsed, trick: [], lastTrick: null, turn: t.opening.p, trickNo: 0, ns: 0, ew: 0,
        waiting: false, over: false, revealed: false, technique: false, claimed: 0, history: [],
        adapted: false,        // расклад З–В уже подстроили под неверную линию
        nsRuffed: [],          // масти, в которых Север–Юг уже перебивали козырем: их защита не продолжает
        ledBy: { N: [], E: [], S: [], W: [] },
        snaps: [],             // снимки перед каждым ходом ученика (отмена хода)
        // Для учебных сдач с подменой карт (onSpadePlay): сколько козырей сыграл Юг, кто взял прошлую взятку
        sTrumpPlayed: 0, lastLeadSuit: null, lastWinner: null, pikPlayed: false
    };
    document.getElementById('dealInfo').innerHTML = t.info;
    document.getElementById('dealResult').classList.remove('show', 'win', 'lose', 'partial');
    document.getElementById('dealTrick').innerHTML = '';
    dealRender();
    const o = t.opening;
    const lead = deal.hands[o.p].find(c => c.s === o.s && c.r === o.r);
    schedule(() => dealPlay(o.p, lead), 900);
}

function dealNext() {
    if (deal.over) return;
    const p = deal.turn;
    if (dealIsNS(p)) {
        // Снимок перед ходом ученика — для «↶ Отменить ход»
        deal.snaps.push(dealSnapshot());
        deal.waiting = true; dealRender(); return;
    }
    deal.waiting = false;
    dealRender();
    schedule(() => dealPlay(p, dealDefenseCard(p)), 650);
}

function dealPlay(p, card) {
    if (deal.over || !dealLegal(p).includes(card)) return;   // ходить в масть обязательно
    // Учебная сдача: при первом ходе Юга в пику карты защиты могут переложиться (см. onSpadePlay)
    if (p === 'S' && card.s === 'S' && !deal.pikPlayed && currentTask.onSpadePlay) {
        deal.pikPlayed = true;
        const key = c => c.s + c.r;
        const before = { W: deal.hands.W.map(key), E: deal.hands.E.map(key) };
        currentTask.onSpadePlay(deal, deal.sTrumpPlayed);
        // Те же перемещения — в исходных руках, чтобы в конце показать сдачу, как её сыграли
        ['W', 'E'].forEach(from => {
            const to = from === 'W' ? 'E' : 'W';
            deal.hands[to].filter(c => before[from].includes(key(c))).forEach(c => {
                const i = deal.orig[from].findIndex(x => key(x) === key(c));
                if (i >= 0) deal.orig[to].push(deal.orig[from].splice(i, 1)[0]);
            });
        });
    }
    if (p === 'S' && card.s === dealTrump()) deal.sTrumpPlayed = (deal.sTrumpPlayed || 0) + 1;
    const hand = deal.hands[p];
    hand.splice(hand.indexOf(card), 1);
    if (!deal.trick.length && !deal.ledBy[p].includes(card.s)) deal.ledBy[p].push(card.s);
    deal.trick.push({ p, card });
    deal.waiting = false;
    deal.turn = dealNextSeat(p);
    dealRender();
    if (deal.trick.length === 4) schedule(dealResolve, 1000);
    else dealNext();
}

function dealResolve() {
    const t = currentTask;
    const w = dealWinner(deal.trick, t.contract.trump);
    if (dealIsNS(w.p)) deal.ns++; else deal.ew++;
    deal.history.push(dealIsNS(w.p) ? 'ns' : 'ew');
    const ledSuit = deal.trick[0].card.s;
    if (dealIsNS(w.p) && w.card.s === t.contract.trump && ledSuit !== t.contract.trump && !deal.nsRuffed.includes(ledSuit))
        deal.nsRuffed.push(ledSuit);
    if (t.technique(deal.trick)) deal.technique = true;
    deal.lastTrick = deal.trick;
    deal.lastLeadSuit = ledSuit;
    deal.lastWinner = w.p;
    deal.trickNo++;
    const need = t.contract.need, left = 13 - deal.trickNo;
    let result = null;
    if (deal.ns >= need) result = 'made';
    else if (deal.ns + left < need) { result = 'down'; deal.downBy = need - deal.ns - left; }
    else if (dealSmall()) {
        // Приём применён и контракт уже не проиграть никакой игрой — заканчиваем, как клейм
        if (deal.technique && deal.ns + dealDD(deal.hands, [], w.p, t.contract.trump, true, new Map()) >= need) {
            deal.claimed = need - deal.ns; result = 'made';
        } else {
            // Даже лучшей игрой контракт уже не выполнить
            const best = dealDD(deal.hands, [], w.p, t.contract.trump, false, new Map());
            if (deal.ns + best < need) { result = 'down'; deal.downBy = need - deal.ns - best; }
        }
    }
    if (result) {
        deal.over = true;
        dealRender();
        schedule(() => dealFinish(result), RESULT_PAUSE);
        return;
    }
    deal.trick = [];
    deal.turn = w.p;
    dealRender();
    dealNext();
}

function dealFinish(result) {
    const t = currentTask;
    deal.revealed = true;
    dealRender();
    const panel = document.getElementById('dealResult');
    const title = document.getElementById('dealResultTitle');
    const text = document.getElementById('dealResultText');
    const buttons = document.getElementById('dealResultButtons');
    buttons.innerHTML = '';
    const addButton = (label, fn) => {
        const b = document.createElement('button');
        b.innerText = label;
        b.onclick = fn;
        buttons.appendChild(b);
    };
    const need = t.contract.need;
    // Счёт взяток в итоговом окне не показываем: сдача часто не доигрывается до конца
    // Решение появляется здесь по кнопке «Показать решение» (кнопки — в одном ряду, как во всех разделах)
    const solution = '<div id="dealSolution"></div>';
    panel.classList.remove('win', 'lose', 'partial');
    // Конструктор: приёма нет — только выполнен ли контракт; можно переиграть те же руки или новую раскладку
    if (t.build) {
        const made = result === 'made';
        panel.classList.add(made ? 'win' : 'lose');
        title.innerText = made ? 'Контракт выполнен!' : 'Контракт не выполнен';
        text.innerHTML = made ? 'Партнёры собрали руки, на которых гейм выполняется. Отличная работа!'
            : 'Контракт без ' + ((deal.downBy || 1) === 1 ? 'одной' : deal.downBy) + '. Попробуйте сыграть иначе или собрать другие руки.';
        addButton('Ещё раз', () => buildPlay(true));
        addButton('Новые руки защиты', () => buildPlay(false));
        addButton('Собрать заново', buildStart);
        panel.classList.add('show');
        return;
    }
    if (result === 'made' && deal.technique) {
        panel.classList.add('win');
        title.innerText = 'Ты справился!';
        text.innerHTML = t.explanation + '<br><br><b>В этой сдаче:</b> ' + t.note;
    } else if (result === 'made') {
        panel.classList.add('partial');
        title.innerText = 'Контракт выполнен!';
        text.innerHTML = 'Ты нашёл свой путь к победе. А теперь попробуй выиграть с помощью приёма, который мы изучаем, — <b>' +
            t.techniqueName + '</b>.' + solution;
        addButton('Показать решение', dealShowSolution);
        addButton(t.techniqueButton || 'Попробовать ещё раз', dealStart);
    } else {
        panel.classList.add('lose');
        title.innerText = 'Упс, контракт не выполнен';
        const down = deal.downBy || 1;
        // Сдача не доигрывается, поэтому счёт взяток здесь не показываем
        const why = (deal.adapted && t.failNote) ? t.failNote + '<br><br>' : '';
        text.innerHTML = why + 'Контракт без ' + (down === 1 ? 'одной' : down) + '. Попробуй ещё раз!' + solution;
        addButton('Показать решение', dealShowSolution);
        addButton('Ещё раз', dealStart);
    }
    panel.classList.add('show');
}
/* ---------- Отмена хода ----------
   Перед каждым ходом Севера или Юга запоминаем положение; отмена возвращает к последнему
   ходу ученика (вместе с картами защиты, сыгранными после него). Работает и после итога. */
const DEAL_SNAP_KEYS = ['hands', 'trick', 'lastTrick', 'turn', 'trickNo', 'ns', 'ew', 'technique', 'claimed',
                        'history', 'nsRuffed', 'ledBy', 'orig', 'sTrumpPlayed', 'lastLeadSuit', 'lastWinner', 'pikPlayed'];
function dealSnapshot() {
    const o = {};
    DEAL_SNAP_KEYS.forEach(k => (o[k] = deal[k]));
    return JSON.stringify(o);
}
function dealUndo() {
    if (!deal || !deal.snaps.length) return;
    clearTimers();
    // Ученик сейчас думает над ходом — этот снимок и есть текущее положение: отходим к предыдущему.
    // Если сдача доигрывается защитой или уже закончена — возвращаемся к последнему ходу ученика.
    if (deal.waiting && !deal.over) {
        if (deal.snaps.length < 2) return;
        deal.snaps.pop();
    }
    Object.assign(deal, JSON.parse(deal.snaps[deal.snaps.length - 1]));
    deal.over = false; deal.revealed = false; deal.downBy = 0; deal.waiting = true;
    document.getElementById('dealResult').classList.remove('show', 'win', 'lose', 'partial');
    document.getElementById('dealTrick').innerHTML = '';
    dealRender();
    if (deal.trick.length) dealPaintTrick(deal.trick, false);
}
function dealGo(d) {
    const list = orderedTasks(currentTask.folder);
    const next = list[list.indexOf(currentTask) + d];
    if (next) loadTask(next.id);
}
function dealShowSolution() {
    const s = document.getElementById('dealSolution');
    s.className = 'solution';
    s.innerHTML = '<b>Решение.</b> ' + currentTask.explanation;
}

/* Показать последнюю взятку ещё раз (пока стол пуст) */
function dealShowLast() {
    if (!deal || !deal.lastTrick || deal.trick.length) return;
    dealPaintTrick(deal.lastTrick, true);
    schedule(() => { if (!deal.trick.length) document.getElementById('dealTrick').innerHTML = ''; }, 2500);
}
function dealPaintTrick(cards, ghost) {
    const area = document.getElementById('dealTrick');
    if (ghost || area.children.length > cards.length) area.innerHTML = '';
    const pos = { N: { row: 1, col: 2 }, W: { row: 2, col: 1 }, E: { row: 2, col: 3 }, S: { row: 3, col: 2 } };
    for (let i = area.children.length; i < cards.length; i++) {
        const { p, card } = cards[i];
        const el = leadCardEl(card.s, card.r);
        if (!ghost) el.classList.add('entering');
        el.style.gridRow = pos[p].row;
        el.style.gridColumn = pos[p].col;
        area.appendChild(el);
    }
}

function dealRender() {
    const legal = deal.waiting ? dealLegal(deal.turn) : [];
    ['N', 'S'].forEach(p => {
        const box = document.getElementById('deal' + p);
        box.innerHTML = '';
        LEAD_SUIT_ORDER.forEach(s => {
            deal.hands[p].filter(c => c.s === s)
                .sort((a, b) => dealRank(b.r) - dealRank(a.r))
                .forEach((c, i) => {
                    const el = leadCardEl(c.s, c.r);
                    if (i === 0 && box.children.length) el.classList.add('suit-gap');
                    if (deal.waiting && deal.turn === p && legal.includes(c)) {
                        el.classList.add('clickable');
                        el.onclick = () => { if (deal.waiting) dealPlay(p, c); };
                    } else el.classList.add('disabled');
                    box.appendChild(el);
                });
        });
    });
    ['W', 'E'].forEach(p => {
        const box = document.getElementById('deal' + p);
        if (deal.revealed) {
            // В конце показываем исходные руки противников
            const hand = deal.orig[p];
            box.className = 'mini-hand revealed';
            box.innerHTML = LEAD_SUIT_ORDER.map(s => {
                const cards = hand.filter(c => c.s === s).sort((a, b) => dealRank(b.r) - dealRank(a.r)).map(c => c.r).join(' ');
                return '<div>' + leadSuitText(LEAD_SYM[s]) + ' ' + (cards || '—') + '</div>';
            }).join('');
        } else {
            const n = deal.hands[p].length;
            box.className = 'mini-hand';
            box.innerHTML = '<div class="mini-backs">' + '<span></span>'.repeat(n) + '</div>' +
                '<div class="mini-count">' + n + ' карт</div>';
        }
    });
    dealPaintTrick(deal.trick, false);
    document.getElementById('dealTally').innerHTML =
        '<div class="tally-row">' + deal.history.map(h => '<span class="t-' + h + '"></span>').join('') + '</div>' +
        '<div class="tally-text">Мы <b>' + deal.ns + '</b> · Они <b>' + deal.ew + '</b></div>';
    const t = currentTask;
    const trumpName = { S: 'пики', H: 'черви', D: 'бубны', C: 'трефы' }[t.contract.trump];
    let turnText = '';
    if (!deal.over) {
        turnText = deal.waiting
            ? ' · <span class="your-turn">Ваш ход: ' + (deal.turn === 'N' ? 'стол' : 'рука') + '</span>'
            : ' · Ходит ' + DEAL_NAMES[deal.turn] + '…';
    }
    const lastBtn = deal.lastTrick && !deal.trick.length && !deal.over
        ? ' <button class="last-btn" onclick="dealShowLast()">Последняя взятка</button>' : '';
    document.getElementById('dealStatus').innerHTML =
        'Козыри: ' + leadSuitText(LEAD_SYM[t.contract.trump]) + ' ' + trumpName +
        ' · Нужно взять <b>' + t.contract.need + '</b>' + turnText + lastBtn;
}

/* ============================================================
   Розыгрыш масти: расклад берётся из заготовленных (sp.layouts);
   засчитывается план из теории, а после него — доигрывание без потерь
   (взяток не меньше цели). Защита играет без ошибок.
   ============================================================ */
const SP = { trickNum: 0, step: 0, order: [], nsTricks: 0, keySeen: false, layout: null,
             planOn: false, leader: null, playedCards: new Set(), showedOut: { W: false, E: false } };
const SP_NAMES = { N:'Север', E:'Восток', S:'Юг', W:'Запад' };
const spMemo = new Map();

function isSmall(c, honors) { return c !== '??' && !honors.includes(c); }
function spCfg() { return currentTask.sp; }
function spSpades(h, p) { return h[p].filter(c => c !== '??'); }
function spHolder(lay, card) { return lay.W.includes(card) ? 'W' : 'E'; }
function spHolderName(lay, card) { return SP_NAMES[spHolder(lay, card)]; }
function spSortHand(h) { return h.sort((a, b) => (RANK_ORDER[b] || 0) - (RANK_ORDER[a] || 0)); }
function spPad(h) { while (h.length < 4) h.push('??'); return spSortHand(h); }
function spRemove(arr, card) { const r = arr.slice(); const i = r.indexOf(card); if (i >= 0) r.splice(i, 1); return r; }
function spBuildOrder(leader) {
    const seq = ['N','E','S','W'];
    const i = seq.indexOf(leader);
    return seq.slice(i).concat(seq.slice(0, i));
}

/* Расклады задаются русскими буквами: 'Т10' → ['A','T'] */
const SP_RU = { 'Т':'A', 'К':'K', 'Д':'Q', 'В':'J', '10':'T' };
function spParse(s) { return (s.match(/10|[ТКДВ2-9]/g) || []).map(c => SP_RU[c] || c); }

/* Заготовленные расклады, в которых правильный план выигрывает, а типичная ошибка теряет взятку.
   Подряд один и тот же расклад не выпадает. */
const spLastLayout = {};
function spDeal(cfg) {
    const n = cfg.layouts.length;
    const last = spLastLayout[currentTask.id];
    let i = Math.floor(Math.random() * n);
    if (n > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (n - 1))) % n;
    spLastLayout[currentTask.id] = i;
    return spLayout(cfg.layouts[i]);
}
/* Расклад: ['Запад', 'Восток', цель] или { W, E, target, note, blunder }.
   note — пояснение к раскладу в итоговом окне; blunder — заготовленная ошибка
   защиты в первой взятке: { player: 'W', card: '5' }. */
function spLayout(l) {
    const o = Array.isArray(l) ? { W: l[0], E: l[1], target: l[2] } : l;
    return { W: spParse(o.W), E: spParse(o.E), target: o.target, note: o.note || '',
             blunder: o.blunder ? { player: o.blunder.player, card: spParse(o.blunder.card)[0] } : null };
}

/* Кто может начать следующую взятку */
function spLeaders(h, lastWinner) {
    const has = p => spSpades(h, p).length > 0;
    const ns = ['N','S'].filter(has);
    if (ns.length === 0 || !spCfg().noEntries) return ns;
    if (lastWinner === 'N' || lastWinner === 'S') return has(lastWinner) ? [lastWinner] : ns;
    return has('S') ? ['S'] : ns;   // защита уходит в другую масть, ход приходит в руку
}

function spTrickWinner(played) {
    let best = null;
    for (const t of played) if (t.card !== '??' && (!best || RANK_ORDER[t.card] > RANK_ORDER[best.card])) best = t;
    return best ? best.player : played[0].player;
}

/* Полный перебор: сколько взяток возьмут Север и Юг при лучшей игре обеих сторон */
function spValue(h, order, pos, played) {
    if (pos === 4) {
        const w = spTrickWinner(played);
        return ((w === 'N' || w === 'S') ? 1 : 0) + spBetween(h, w);
    }
    const p = order[pos];
    const options = spSpades(h, p);
    if (options.length === 0) options.push('??');
    const maximize = (p === 'N' || p === 'S');
    let result = maximize ? -1 : 99;
    for (const c of options) {
        const nh = Object.assign({}, h);
        nh[p] = spRemove(h[p], c);
        const v = spValue(nh, order, pos + 1, played.concat([{ player: p, card: c }]));
        result = maximize ? Math.max(result, v) : Math.min(result, v);
    }
    return result;
}

function spBetween(h, lastWinner) {
    const leaders = spLeaders(h, lastWinner);
    if (leaders.length === 0) return 0;
    const key = currentTask.id + ':' + (spCfg().noEntries ? lastWinner : '') + ':' +
        ['N','E','S','W'].map(p => spSpades(h, p).join('')).join('|');
    if (spMemo.has(key)) return spMemo.get(key);
    let best = 0;
    for (const l of leaders) best = Math.max(best, spValue(h, spBuildOrder(l), 0, []));
    spMemo.set(key, best);
    return best;
}

function spCardValue(h, p, card) {
    const nh = Object.assign({}, h);
    nh[p] = spRemove(h[p], card);
    return spValue(nh, SP.order, SP.step + 1, trick.concat([{ player: p, card }]));
}

/* Своя старшая карта уже берёт взятку, а ученик кладёт на неё фигуру, имея мелкую */
function spWastesHonor(p, card) {
    const isHonor = c => RANK_ORDER[c] >= RANK_ORDER['J'];
    const partner = trick.find(t => t.player === (p === 'N' ? 'S' : 'N'));
    if (!partner || !isHonor(partner.card) || spTrickWinner(trick) !== partner.player) return false;
    return isHonor(card) && spSpades(hands, p).some(c => !isHonor(c));
}

function spContext() {
    const second = trick.length > 1 ? trick[1].card : null;
    return { round: SP.trickNum, step: SP.step, leader: SP.leader, second, played: trick, layout: SP.layout };
}

function spStart() {
    const cfg = spCfg();
    const d = spDeal(cfg);
    hands = { N: spPad(cfg.N.slice()), S: spPad(cfg.S.slice()), W: spPad(d.W.slice()), E: spPad(d.E.slice()) };
    SP.layout = { W: spSortHand(d.W.slice()), E: spSortHand(d.E.slice()) };
    trick = [];
    correct = true;
    SP.trickNum = 0;
    SP.step = 0;
    SP.order = [];
    SP.nsTricks = 0;
    SP.finishedEarly = false;
    SP.claimed = 0;
    SP.keySeen = false;
    SP.planOn = false;
    SP.offPlan = false;
    SP.hist = [];
    SP.playedCards = new Set();
    SP.showedOut = { W: false, E: false };
    spMemo.clear();
    // Сколько взяток можно взять в этом раскладе при лучшей игре
    const starts = cfg.firstLeader ? [cfg.firstLeader] : ['N', 'S'];
    SP.note = d.note;
    SP.blunder = d.blunder;
    SP.target = d.target || cfg.target || Math.max(...starts.map(l => spValue(hands, spBuildOrder(l), 0, [])));
    const goal = document.getElementById('taskGoal');
    // В задачах «на максимум» число взяток не показываем: оно подсказало бы, удачно ли лежит масть
    goal.innerHTML = cfg.goal || ('Возьмите <b>максимум взяток</b>' +
        (cfg.noThreeThree ? '. Распределение 3-3 не рассматриваем.' : '.'));
    goal.classList.remove('hidden');
    render();
    if (cfg.firstLeader) { spBeginTrick(cfg.firstLeader, false); return; }
    const hint = cfg.hint ? cfg.hint(SP.layout) + '<br>' : '';
    showLeaderPanel(hint + 'С какой руки начать розыгрыш?', null, l => spBeginTrick(l, true));
}

function spBeginTrick(leader, chosen) {
    const cfg = spCfg();
    SP.planOn = SP.trickNum < cfg.planRounds && !SP.keySeen && !SP.offPlan;
    if (chosen && SP.planOn && !cfg.planLeader(leader, spContext())) spDeviation(SP.hist.join(' | ') + ' || ход с ' + leader);
    SP.leader = leader;
    SP.order = spBuildOrder(leader);
    SP.step = 0;
    spNext();
}

function spPlay(p, card) {
    if (card === '??') SP.showedOut[p] = true;
    else SP.playedCards.add(card);
    playCard(p, card);
    SP.step++;
}

function spNext() {
    if (SP.step >= 4) { spResolve(); return; }
    const p = SP.order[SP.step];
    if (spSpades(hands, p).length === 0) {
        schedule(() => { spPlay(p, '??'); spNext(); }, 550);
        return;
    }
    if (p === 'N' || p === 'S') {
        waiting = { player: p, expected: null };
        render();
    } else {
        schedule(() => { spPlay(p, spDefenseCard(p)); spNext(); }, 550);
    }
}

/* Защита играет без ошибок. Из равноценных карт: если взятку сейчас берёт разыгрывающий
   и вистующий ходит последним — бьёт самой дешёвой старшей картой (так играют живые
   вистующие), иначе кладёт младшую */
function spDefenseCard(p) {
    // Заготовленная ошибка вистующего в первой взятке
    const b = SP.blunder;
    if (b && SP.trickNum === 0 && b.player === p && hands[p].includes(b.card)) return b.card;
    const spades = spSpades(hands, p).sort((a, b) => RANK_ORDER[a] - RANK_ORDER[b]);
    const values = spades.map(c => spCardValue(hands, p, c));
    const bestValue = Math.min(...values);
    const equal = spades.filter((c, i) => values[i] === bestValue);
    // Только четвёртой рукой: второй рукой живые вистующие обычно кладут мелкую
    const top = trick.length === 3 ? spTrickWinner(trick) : null;
    if (top === 'N' || top === 'S') {
        const topRank = RANK_ORDER[trick.find(t => t.player === top).card];
        const beat = equal.find(c => RANK_ORDER[c] > topRank);
        if (beat) return beat;
    }
    return equal[0];
}

function spOnClick(player, card) {
    if (!waiting || waiting.player !== player) return;
    const wastes = spWastesHonor(player, card);
    if (SP.offPlan) { if (wastes) correct = false; }
    else if (wastes || (SP.planOn && !spCfg().planCard(player, card, spContext())))
        spDeviation(SP.hist.join(' | ') + (SP.hist.length ? ' | ' : '') + trick.map(spSig).join(' ') +
                    ' >> ' + player + (RANK_LABEL[card] || card));
    waiting = null;
    spPlay(player, card);
    spNext();
}

function spResolve() {
    const winner = spTrickWinner(trick);
    if (trick.some(t => t.card === spCfg().key)) SP.keySeen = true;
    // План может закончиться досрочно (например, выпала бланковая фигура)
    if (spCfg().planEnds && spCfg().planEnds(trick, SP.trickNum)) SP.keySeen = true;
    if (winner === 'N' || winner === 'S') SP.nsTricks++;
    const leaders = spLeaders(hands, winner);
    // Цель уже обеспечена (взятые взятки + старшие карты) — доигрывать нет смысла, как клейм за столом
    if (leaders.length > 0 && SP.nsTricks < SP.target) {
        const top = spTopTricks(hands);
        // Ключевая карта уже вышла — гадать не о чем: заканчиваем, если цель достижима
        const sure = SP.keySeen && spCfg().key ? spBetween(hands, winner) : top;
        if (SP.nsTricks + Math.max(top, sure) >= SP.target) { SP.claimed = SP.target - SP.nsTricks; SP.nsTricks = SP.target; }
    }
    SP.finishedEarly = leaders.length > 0 && SP.nsTricks >= SP.target;
    if (leaders.length === 0 || SP.finishedEarly) {
        // Последняя взятка остаётся на столе — итог покажем после паузы
        SP.trickNum++;
        if (SP.nsTricks < SP.target) correct = false;
        showResult();
        return;
    }
    SP.hist.push(trick.map(spSig).join(' '));   // история взяток — для поиска равноценных отступлений
    schedule(() => {
        trick = [];
        SP.trickNum++;
        render();
        if (leaders.length === 1) { spBeginTrick(leaders[0], false); return; }
        const defenderWon = (winner === 'W' || winner === 'E');
        const text = '<span class="who">' + SP_NAMES[winner] + '</span> ' +
            (defenderWon ? 'взял взятку и сменил масть.' : 'получил взятку.') +
            '<br>С какой руки продолжить?';
        showLeaderPanel(text, null, l => spBeginTrick(l, true));
    }, 900);
}

/* Сколько взяток гарантированно берут старшие карты: карты Севера и Юга выше всех
   оставшихся карт защиты, но не больше числа оставшихся кругов */
function spTopTricks(h) {
    const def = spSpades(h, 'W').concat(spSpades(h, 'E'));
    const highest = Math.max(0, ...def.map(c => RANK_ORDER[c]));
    const ns = spSpades(h, 'N').concat(spSpades(h, 'S'));
    const masters = ns.filter(c => RANK_ORDER[c] > highest).length;
    const rounds = Math.max(spSpades(h, 'N').length, spSpades(h, 'S').length);
    // Когда у защиты кончатся карты масти, оставшиеся наши карты тоже берут взятки
    const defLen = Math.max(spSpades(h, 'W').length, spSpades(h, 'E').length);
    return Math.min(rounds, masters + Math.max(0, rounds - defLen));
}

/* ---------- Равноценные отступления от плана ----------
   Ученик может сыграть не так, как в теории, но так же хорошо: по уже открытым картам такая игра
   не проигрывает ни в одном раскладе, где выигрывает план. Такие ходы засчитываем как правильные.
   Для задачи один раз перебираем все расклады и собираем «подписи» отступлений (что сыграно до этого
   момента + ход ученика); равноценное — то, что ни разу не потеряло взятку. */
const spEquivCache = {};
const spSig = (t) => t.player + (RANK_LABEL[t.card] || t.card);
function spDevMap(task, W, E) {
    const cfg = task.sp, d = spLayout([W, E]);
    const h0 = { N: spPad(cfg.N.slice()), S: spPad(cfg.S.slice()), W: spPad(d.W.slice()), E: spPad(d.E.slice()) };
    const layout = { W: spSortHand(d.W.slice()), E: spSortHand(d.E.slice()) };
    const starts = cfg.firstLeader ? [cfg.firstLeader] : ['N', 'S'];
    const target = cfg.target || Math.max(...starts.map(l => spValue(h0, spBuildOrder(l), 0, [])));
    const devs = {}, hist = [];
    const mark = (sig, ok) => { devs[sig] = devs[sig] || ok; };
    function afterTrick(h, played, round, ns, keySeen) {
        const w = spTrickWinner(played);
        if (played.some(t => t.card === cfg.key)) keySeen = true;
        if (cfg.planEnds && cfg.planEnds(played, round)) keySeen = true;
        if (w === 'N' || w === 'S') ns++;
        const leaders = spLeaders(h, w);
        if (leaders.length > 0 && ns < target) {
            const top = spTopTricks(h), sure = keySeen && cfg.key ? spBetween(h, w) : top;
            if (ns + Math.max(top, sure) >= target) return target;
        }
        if (leaders.length === 0 || ns >= target) return ns;
        hist.push(played.map(spSig).join(' '));
        const v = startTrick(h, round + 1, ns, keySeen, leaders, leaders.length > 1);
        hist.pop();
        return v;
    }
    function startTrick(h, round, ns, keySeen, leaders, chosen) {
        const planOn = round < cfg.planRounds && !keySeen;
        let A = planOn ? 99 : -1;
        for (const l of leaders) {
            const order = spBuildOrder(l);
            if (!(chosen && planOn && !cfg.planLeader(l, { round, step: 0, leader: l, second: null, played: [], layout }))) {
                const v = step(h, order, 0, [], round, ns, keySeen, planOn, l);
                A = planOn ? Math.min(A, v) : Math.max(A, v);
            } else mark(hist.join(' | ') + ' || ход с ' + l, ns + spValue(h, order, 0, []) >= target);
        }
        return A;
    }
    function step(h, order, pos, played, round, ns, keySeen, planOn, leader) {
        if (pos === 4) return afterTrick(h, played, round, ns, keySeen);
        const p = order[pos], cards = spSpades(h, p);
        const next = c => { const nh = Object.assign({}, h); nh[p] = spRemove(h[p], c); return [nh, played.concat([{ player: p, card: c }])]; };
        if (cards.length === 0) { const [nh, pl] = next('??'); return step(nh, order, pos + 1, pl, round, ns, keySeen, planOn, leader); }
        if (p === 'W' || p === 'E') {
            hands = h; trick = played; SP.order = order; SP.step = pos; SP.blunder = null; SP.trickNum = round;
            const [nh, pl] = next(spDefenseCard(p));
            return step(nh, order, pos + 1, pl, round, ns, keySeen, planOn, leader);
        }
        let A = planOn ? 99 : -1;
        for (const c of cards) {
            const [nh, pl] = next(c);
            trick = played; hands = h;
            const ctx = { round, step: pos, leader, second: played.length > 1 ? played[1].card : null, played, layout };
            if (!spWastesHonor(p, c) && (!planOn || cfg.planCard(p, c, ctx))) {
                const v = step(nh, order, pos + 1, pl, round, ns, keySeen, planOn, leader);
                A = planOn ? Math.min(A, v) : Math.max(A, v);
            } else mark(hist.join(' | ') + (hist.length ? ' | ' : '') + played.map(spSig).join(' ') + ' >> ' + p + (RANK_LABEL[c] || c),
                        ns + spValue(nh, order, pos + 1, pl) >= target);
        }
        return A;
    }
    const A = startTrick(h0, 0, 0, false, starts, !cfg.firstLeader);
    return { planOK: A >= target, devs };
}
function spEquivSet(task) {
    if (spEquivCache[task.id]) return spEquivCache[task.id];
    // Перебор пользуется общими переменными игры — сохраняем и восстанавливаем их
    const saved = { hands, trick, order: SP.order, step: SP.step, blunder: SP.blunder, trickNum: SP.trickNum };
    const cfg = task.sp, RU = { A: 'Т', K: 'К', Q: 'Д', J: 'В', T: '10' }, ru = a => a.map(c => RU[c] || c).join('');
    const real = new Set(), seen = new Set();
    for (let mask = 0; mask < (1 << cfg.missing.length); mask++) {
        const W = [], E = [];
        cfg.missing.forEach((c, i) => ((mask >> i) & 1 ? W : E).push(c));
        if (cfg.noThreeThree && W.length === 3 && E.length === 3) continue;
        const r = spDevMap(task, ru(W), ru(E));
        if (!r.planOK) continue;
        Object.entries(r.devs).forEach(([s, ok]) => { seen.add(s); if (!ok) real.add(s); });
    }
    hands = saved.hands; trick = saved.trick;
    Object.assign(SP, { order: saved.order, step: saved.step, blunder: saved.blunder, trickNum: saved.trickNum });
    spEquivCache[task.id] = new Set([...seen].filter(s => !real.has(s)));
    return spEquivCache[task.id];
}
/* Отступление от плана: равноценное — дальше план не проверяем; иначе — ошибка */
function spDeviation(sig) {
    if (spEquivSet(currentTask).has(sig)) SP.offPlan = true;
    else correct = false;
}

function spSummary() {
    const fmt = cards => cards.length ? cards.map(c => RANK_LABEL[c] || c).join(' ') : 'пусто';
    return '<br><br><b>Расклад:</b> Запад – ' + fmt(SP.layout.W) + ', Восток – ' + fmt(SP.layout.E) + '.<br>' +
        '<b>Взято взяток:</b> ' + SP.nsTricks + ', по оптимальному плану — ' + SP.target + '.' +
        (SP.claimed ? '<br>Из них ' + SP.claimed + ' — оставшимися картами: дальше гадать не о чем, доигрывать не нужно.'
            : SP.finishedEarly ? '<br>Цель достигнута — остальные карты доигрывать не нужно.' : '');
}

/* Разделы сгруппированы по темам: вист, торговля, розыгрыш. Номер раздела (id) — для ссылок ?razdel=N */
const FOLDER_GROUPS = ['Вист', 'Торговля', 'Розыгрыш', 'Конструктор'];
/* Единый вход в раздел: theory — меню «Правила / Задачи»; direct — сразу первая задача */
const FOLDERS = [

    { id: 7, name: 'Вист на второй руке: тренировка', group: 'Вист', direct: true, hidden: true },
    { id: 8, name: 'Вист на третьей руке', group: 'Вист', theory: true },

    { id: 3, name: 'Экспасс с убиткой', group: 'Розыгрыш', direct: true },
    { id: 9, name: 'Распознать карты оппонента', group: 'Розыгрыш', direct: true },
    { id: 10, name: 'Потеря на потерю', group: 'Розыгрыш', theory: true },
    { id: 11, name: 'Инвит на дополнение', group: 'Конструктор', direct: true }
];
// direct: true — при входе в раздел сразу открывается первая задача, внизу — «Предыдущая / Следующая»
let currentFolder = null;
/* Первая страница практикума: выбрана папка раздела (Вист, Торговля…). null — ещё не выбрана.
   В файле урока не используется: там короткий список, лишний шаг не нужен. */
let currentGroup = null;

/* Файл урока: только выбранные разделы и задачи. В sd.html — null (весь практикум).
   Например: { folders: [3, 7, 2], tasks: { 3: [34, 35, 36] } } */
const LESSON = null;
/* Раздел открывается сразу задачей — кроме разделов, которые в уроке показаны списком задач (LESSON.lists) */
const isDirect = f => !!f.direct && !(LESSON && LESSON.lists && LESSON.lists.includes(f.id));
const visibleFolders = () => LESSON ? FOLDERS.filter(f => LESSON.folders.includes(f.id)) : FOLDERS;

function folderTasks(folderId) {
    const only = LESSON && LESSON.tasks && LESSON.tasks[folderId];
    return TASKS.filter(t => (t.folder || 1) === folderId && (!only || only.includes(t.id)));
}
/* Порядок задач в разделе: для разделов с shuffle — перемешанный при входе */
const folderOrder = {};
function orderedTasks(folderId) {
    const list = folderTasks(folderId), ord = folderOrder[folderId];
    return ord ? ord.map(id => list.find(t => t.id === id)).filter(Boolean) : list;
}
function shuffleFolder(folderId) {
    const ids = folderTasks(folderId).map(t => t.id);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    folderOrder[folderId] = ids;
}
/* Переход к соседней задаче раздела (экран розыгрыша масти) */
function taskGo(d) {
    const list = orderedTasks(currentTask.folder || 1);
    const next = list[list.indexOf(currentTask) + d];
    if (next) loadTask(next.id);
}
/* Последняя задача папки в полном практикуме: выход сразу на главную, мимо списка подраздела */
function isLastInFolder() {
    if (!currentTask) return false;
    const list = sectionList(currentTask.folder || 1);
    return list.length > 0 && list[list.length - 1] === currentTask.id;
}
function folderDone() {
    return !LESSON && lockedFolder === null && !!currentFolder && isDirect(currentFolder) && isLastInFolder();
}
/* Подпись кнопки «назад»; null — кнопки нет (раздел по ссылке, задачи без меню) */
function backLabel() {
    if (!currentFolder) return 'К разделам';
    if (!isDirect(currentFolder)) return 'К разделу';   // раздел с меню «Правила / Задачи»
    if (currentFolder.parent && lockedFolder !== currentFolder.id) return 'К темам';   // тренировка — назад к темам раздела
    if (lockedFolder !== null) return null;
    if (folderDone()) return 'К разделам';
    return currentGroup || 'К разделам';
}
function setBackButton(id) {
    const el = document.getElementById(id), l = backLabel();

}

function taskWord(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'задача';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'задачи';
    return 'задач';
}
function sectionWord(n) {

    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'раздела';

function addMenuCard(grid, num, name, onclick, extraClass) {

function menuFolders() {

}
function renderMenu() {
    const grid = document.getElementById('taskGrid');

    grid.innerHTML = '';
    grid.classList.remove('groups-grid');
    if (!currentFolder) {
        const folders = menuFolders().filter(f => !currentGroup || f.group === currentGroup);
        const groups = FOLDER_GROUPS.filter(g => menuFolders().some(f => f.group === g));
        // Практикум целиком: сначала только папки разделов. В уроке список короткий — сразу разделы.
        if (!LESSON && !currentGroup && groups.length > 1) {

            groups.forEach(g => {
                const n = menuFolders().filter(f => f.group === g).length;
                addMenuCard(grid, '📁 ' + n + ' ' + sectionWord(n), g, () => openGroup(g), 'folder-card');
            });

        }
        sub.innerText = currentGroup || 'Выберите раздел';
        back.classList.toggle('hidden', !currentGroup);
        if (currentGroup) back.innerText = '← К разделам';
        FOLDER_GROUPS.forEach(g => {
            const list = folders.filter(f => f.group === g);
            if (!list.length) return;
            if (!currentGroup) {
                const head = document.createElement('div');
                head.className = 'menu-group';
                head.innerText = g;
                grid.appendChild(head);
            }
            list.forEach(f => {
                const n = f.id === 7 ? GV_COUNT : folderTasks(f.id).length;
                const sn = sectionList(f.id).length;
                const count = f.id === 5 ? '18 сдач' : f.id === 7 ? 'новые задачи' :
                    f.theory ? 'правила и ' + sn + ' ' + taskWord(sn) : n ? n + ' ' + taskWord(n) : 'скоро';

    // Сборники по темам («Вист на второй руке», «Вист на третьей руке»); комбинации в меню не показываем
    // Раздел с теорией: две карточки — «Правила» и «Задачи» (сразу задача 1)
    if (currentFolder.theory) {
        const fid = currentFolder.id, list = sectionList(fid);
        addMenuCard(grid, '📖 Теория', 'Правила', () => showTheory(fid));
        addMenuCard(grid, '🎯 ' + list.length + ' ' + taskWord(list.length), 'Задачи', () => loadTask(list[0]));
        return;
    }
    if (THEMES[currentFolder.id]) {
        let num = 0;
        THEMES[currentFolder.id].forEach((th, i) => {
            if (th.hidden) return;
            num++;
            // Задачи с открытыми руками открываются своим экраном, остальные темы — через правило темы
            const open = TASKS.find(x => x.id === th.tasks[0]).type === 'open';
            addMenuCard(grid, th.card ? th.card[0] : 'Тема ' + num + ' · ' + th.tasks.length + ' ' + taskWord(th.tasks.length),
                th.card ? th.card[1] : th.name, () => open ? loadTask(th.tasks[0]) : gvThemeOpen(i));
        });
        // Разделы, вложенные в этот (тренировка в «Висте на второй руке»)
        FOLDERS.filter(f => f.parent === currentFolder.id && (!LESSON || LESSON.folders.includes(f.id))).forEach(f =>
            addMenuCard(grid, 'Тренировка · новые задачи', f.name, () => openFolder(f.id)));

}

function loadTask(taskId) {

const BUILD = { step: 0, hands: { S: [], N: [] }, msg: '' };
const B_SUITS = [['S', '♠'], ['H', '♥'], ['D', '♦'], ['C', '♣']];
const bCls = s => (s === 'H' || s === 'D') ? 'red' : s === 'C' ? 'club' : '';
const bSort = h => h.slice().sort((a, b) => B_SUITS.findIndex(x => x[0] === a.s) - B_SUITS.findIndex(x => x[0] === b.s) ||
    LEAD_RANKS.indexOf(a.r) - LEAD_RANKS.indexOf(b.r));
const bHas = (h, s, r) => h.some(c => c.s === s && c.r === r);
/* Заявка 1♥ / 1♠: больше 11 очков. Мелкую карту принимаем, пока оставшимися ещё можно добрать до 12. */
function bTooWeakToOpen(h) {
    const need = 12 - bHcp(h);
    if (need <= 0) return false;
    const slots = 13 - h.length;
    if (slots <= 0) return true;
    const left = [];
    B_SUITS.forEach(([s]) => LEAD_RANKS.forEach(r => { if (!bHas(h, s, r)) left.push(B_HCP[r] || 0); }));
    left.sort((a, b) => b - a);
    let add = 0;
    for (let i = 0; i < slots && i < left.length; i++) add += left[i];
    return add < need;
}

/* Руки Запада и Востока — случайные: очки поровну (разница не больше 2),
   пятёрка пик — либо у обоих, либо ни у кого */
function buildDealEW() {
    const used = BUILD.hands.S.concat(BUILD.hands.N);
    const rest = [];
    B_SUITS.forEach(([s]) => LEAD_RANKS.forEach(r => { if (!bHas(used, s, r)) rest.push({ s, r }); }));
    for (let i = 0; i < 10000; i++) {
        for (let k = rest.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [rest[k], rest[j]] = [rest[j], rest[k]]; }
        const W = rest.slice(0, 13), E = rest.slice(13, 26);
        if (Math.abs(bHcp(W) - bHcp(E)) > 2) continue;
        const sw = W.filter(c => c.s === 'S').length, se = E.filter(c => c.s === 'S').length;
        if ((sw >= 5 || se >= 5) && !(sw >= 5 && se >= 5)) continue;
        return { W, E };
    }
    return { W: rest.slice(0, 13), E: rest.slice(13, 26) };
}
const bHandStr = h => B_SUITS.map(([s]) => s + ':' + bSort(h).filter(c => c.s === s).map(c => c.r).join('')).join(' ');
function buildPlay(sameEW) {
    const t = currentTask;
    if (!sameEW || !t.hands) {
        const ew = buildDealEW();
        t.hands = { N: bHandStr(BUILD.hands.N), S: bHandStr(BUILD.hands.S), W: bHandStr(ew.W), E: bHandStr(ew.E) };
        // Атака Запада — по правилам защиты движка
        deal = { hands: {}, trick: [], ledBy: { N: [], E: [], S: [], W: [] }, nsRuffed: [] };
        DEAL_SEATS.forEach(p => (deal.hands[p] = dealParse(t.hands[p])));
        const lead = dealLeadCard('W');
        t.opening = { p: 'W', s: lead.s, r: lead.r };

    document.getElementById('dealScreen').classList.remove('hidden');

        const el = createCardEl(card, isDiscard ? false : faceUp);
        if (isWaiting && !isDiscard) {
            el.classList.add('clickable');
            el.onclick = () => onCardClick(player, card);
        } else {
            el.classList.add('disabled');
        }
        container.appendChild(el);
    });
}
/* Карты на столе не пересоздаём: добавляем только новые, иначе при каждой
   перерисовке последняя карта «прилетает» заново и дёргается */
function renderTrick() {
    const area = document.getElementById('trickArea');
    if (area.children.length > trick.length) area.innerHTML = '';
    const positions = { N:{row:1,col:2}, W:{row:2,col:1}, E:{row:2,col:3}, S:{row:3,col:2} };
    for (let idx = area.children.length; idx < trick.length; idx++) {
        const { player, card } = trick[idx];
        const pos = positions[player];
        const el = createCardEl(card, true);
        el.classList.add('played', 'entering');
        el.style.gridRow = pos.row;
        el.style.gridColumn = pos.col;
        area.appendChild(el);
    }
}

/* Ссылка на один раздел: sd.html?razdel=2 — открывается только этот раздел */

{
